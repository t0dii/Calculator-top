<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Calculator app</title>
</head>
<body>
    <h1>Calculator</h1>
    <div id="calculator">
        <div class="calculator-display">0</div>

        <div class="buttons-display">
            <button>X</button>
            <button id="clear">AC</button>
            <button>%</button>
            <button>/</button>
        </div>

        <div class="buttons-display">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>X</button>
        </div>

        <div class="buttons-display">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
        </div>

        <div class="buttons-display">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
        </div>

        <div class="buttons-display">
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>
    </div>


    <script src="calculator.js"></script>
</body>
</html>
